[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suraksha-ai"
version = "1.0.0"
description = "AI-powered CCTV safety monitoring dashboard"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "SurakshaAI Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.15.0",
    "opencv-python-headless>=4.8.0.74",
    "pillow>=10.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "folium>=0.14.0",
    "streamlit-folium>=0.13.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py30', 'py311', 'py312']
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py38"
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.8"
warn_unused_configs = true
warn_return_any = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.basilisk]

[tool.basilisk.rule-tags]
basilisk = "error"
